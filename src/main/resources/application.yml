spring:
  application:
    name: velora-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/velora}
    username: ${DB_USERNAME:velora}
    password: ${DB_PASSWORD:velora}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Brevo transactional SMTP relay. Only used if BrevoPasswordResetOtpNotifier activates
  # (see its @ConditionalOnExpression) - harmless to configure unconditionally otherwise,
  # since nothing sends mail through it unless that bean exists.
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_EMAIL:}
    password: ${BREVO_SMTP_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/files}
  jwt:
    secret: ${JWT_SECRET:}
    # Short by design now that refresh tokens exist: an access token cannot be revoked,
    # so its lifetime is the window a stolen one stays useful. The client refreshes.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    issuer: velora-backend
  auth:
    # Long-lived and revocable - this is what keeps a phone signed in between uses.
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    password-reset-ttl: ${PASSWORD_RESET_TTL:30m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:19000,http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.velora.backend: INFO
