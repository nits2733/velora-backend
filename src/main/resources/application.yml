spring:
  application:
    name: velora-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/velora}
    username: ${DB_USERNAME:velora}
    password: ${DB_PASSWORD:velora}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/files}
  jwt:
    secret: ${JWT_SECRET:}
    # Short by design now that refresh tokens exist: an access token cannot be revoked,
    # so its lifetime is the window a stolen one stays useful. The client refreshes.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    issuer: velora-backend
  auth:
    # Long-lived and revocable - this is what keeps a phone signed in between uses.
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    password-reset-ttl: ${PASSWORD_RESET_TTL:30m}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  brevo:
    # Brevo API key (dashboard -> SMTP & API -> API Keys) - not the SMTP key.
    # Emails go via Brevo's HTTPS API, not SMTP (see BrevoEmailService).
    api-key: ${BREVO_API_KEY:}
    from-email: ${BREVO_FROM_EMAIL:onboarding@brevo.com}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    cooldown-seconds: ${OTP_COOLDOWN_SECONDS:60}
    length: ${OTP_LENGTH:6}
  cloudinary:
    url: ${CLOUDINARY_URL:}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:velora-dev}
    api-key: ${CLOUDINARY_API_KEY:mock-key}
    api-secret: ${CLOUDINARY_API_SECRET:mock-secret}
  rate-limit:
    forgot-password-capacity: ${RATE_LIMIT_FORGOT_PASSWORD_CAPACITY:5}
    forgot-password-duration: ${RATE_LIMIT_FORGOT_PASSWORD_DURATION:15m}
    media-upload-capacity: ${RATE_LIMIT_MEDIA_UPLOAD_CAPACITY:20}
    media-upload-duration: ${RATE_LIMIT_MEDIA_UPLOAD_DURATION:1h}
    otp-verify-capacity: ${RATE_LIMIT_OTP_VERIFY_CAPACITY:10}
    otp-verify-duration: ${RATE_LIMIT_OTP_VERIFY_DURATION:1m}
  media-upload:
    max-file-size: ${MEDIA_UPLOAD_MAX_FILE_SIZE:10485760}
    allowed-content-types: ${MEDIA_UPLOAD_ALLOWED_CONTENT_TYPES:image/jpeg,image/jpg,image/png,image/webp}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:19000,http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.velora.backend: INFO

vision:
  daily-limit: ${VISION_DAILY_LIMIT:5}
  style-prefix: ${VISION_STYLE_PREFIX:interior design photo, same room layout, }
  image-strength: ${VISION_IMAGE_STRENGTH:0.35}
  stale-after: ${VISION_STALE_AFTER:20m}
  api-url: ${VISION_API_URL:https://api.stability.ai/v2beta/stable-image/generate}
  engine: ${VISION_ENGINE:sd3}
  api-key: ${STABILITY_API_KEY:}
  timeout: ${VISION_TIMEOUT:60s}
  negative-prompt-enabled: ${VISION_NEGATIVE_PROMPT_ENABLED:true}
  duplicate-window: ${VISION_DUPLICATE_WINDOW:60s}
  min-short-side: ${VISION_MIN_SHORT_SIDE:512}
  target-pixels: ${VISION_TARGET_PIXELS:1000000}
  max-input-pixels: ${VISION_MAX_INPUT_PIXELS:40000000}
  preprocess-concurrency: ${VISION_PREPROCESS_CONCURRENCY:2}
  preprocess-wait: ${VISION_PREPROCESS_WAIT:5s}
  jpeg-quality: ${VISION_JPEG_QUALITY:0.92}
  # UNCALIBRATED strengths: hypotheses pending real-image evaluation
  strength-preserve-original: ${VISION_STRENGTH_PRESERVE_ORIGINAL:0.30}
  strength-balanced: ${VISION_STRENGTH_BALANCED:0.50}
  strength-creative: ${VISION_STRENGTH_CREATIVE:0.70}
